# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main, "build/phase-a-b-c", "build/phase-e-trainer-orchestration"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: container_ci
          POSTGRES_USER: container
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U container -d container_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTAINER_DATABASE_URL: postgresql+psycopg://container:ci-only-password@127.0.0.1:5432/container_ci
      CONTAINER_JWT_SECRET: ci-only-secret-not-used-for-production-tests
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . ../../eval
      - name: Validate Studio JavaScript syntax
        run: |
          node --check src/container_api/static/app.js
          node --check src/container_api/static/chat.js
          node --check src/container_api/static/pwa.js
      - name: Verify PostgreSQL database migrations
        run: alembic upgrade head
      - name: Test API and evaluation contracts
        run: pytest
      - name: Verify frozen evaluation hash and training-data quarantine
        working-directory: .
        run: python -m eval.check_quarantine
